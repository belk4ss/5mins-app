server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:sqlite:./fivemins.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    database-platform: org.hibernate.community.dialect.SQLiteDialect

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32chars}
    expiration-ms: 86400000
  cors-origin: http://localhost:4200
