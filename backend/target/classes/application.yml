spring:
  datasource:
    url: jdbc:h2:mem:fivemins;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
# Pour PostgreSQL : remplacer datasource par jdbc:postgresql://localhost:5432/fivemins
# et ajouter la dépendance org.postgresql:postgresql dans le pom.xml
app:
  jwt:
    secret: change-me-change-me-change-me-change-me-32chars
    expiration-ms: 86400000
  cors-origin: http://localhost:4200
